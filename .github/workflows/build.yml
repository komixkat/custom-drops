name: Build & Release

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  discover-versions:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.discover.outputs.targets }}
    steps:
      - name: Discover Minecraft releases and resolve per-version build inputs
        id: discover
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          from xml.etree import ElementTree

          def ver(v):
              return tuple(int(x) for x in str(v).split('.'))

          def nj(url):
              with urllib.request.urlopen(url, timeout=60) as r:
                  return json.load(r)

          def meta_versions(url):
              with urllib.request.urlopen(url, timeout=60) as r:
                  root = ElementTree.fromstring(r.read())
              return [e.text for e in root.findall('.//version') if e.text]

          def vkey(version):
              return tuple(int(x) for x in re.split(r'[.+_-]', version) if x.isdigit())

          manifest = nj('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json')
          releases = sorted(
              (v for v in manifest['versions'] if v['type'] == 'release' and ver(v['id']) >= (26, 2)),
              key=lambda v: ver(v['id']))

          fabric_api_versions = meta_versions(
              'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml')

          targets = []
          for rel in releases:
              mc = rel['id']
              meta = nj(rel['url'])
              java = max(int((meta.get('javaVersion') or {}).get('majorVersion') or 25), 25)

              loaders = nj(f'https://meta.fabricmc.net/v2/versions/loader/{mc}')
              loader = loaders[0]['loader']['version'] if loaders else ''

              api_candidates = [v for v in fabric_api_versions if v.endswith('+' + mc)]
              fabric_api = max(api_candidates, key=vkey) if api_candidates else ''

              targets.append({
                  'minecraft': mc,
                  'java': java,
                  'loader': loader,
                  'fabric_api': fabric_api,
              })
              print(f'resolved {mc}: java={java} loader={loader} fabric_api={fabric_api}', flush=True)

          with open('targets.json', 'w') as out:
              json.dump(targets, out)
          PY
          cat targets.json
          echo "targets=$(cat targets.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: discover-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover-versions.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.target.java }}

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.5.1

      - name: Build for Minecraft ${{ matrix.target.minecraft }} (Java ${{ matrix.target.java }})
        env:
          LOADER: ${{ matrix.target.loader }}
          FABRIC_API: ${{ matrix.target.fabric_api }}
        run: |
          ARGS="-Pminecraft_version=${{ matrix.target.minecraft }} -Pmod_version=${{ matrix.target.minecraft }}"
          if [ -n "$LOADER" ]; then ARGS="$ARGS -Ploader_version=$LOADER"; fi
          if [ -n "$FABRIC_API" ]; then ARGS="$ARGS -Pfabric_version=$FABRIC_API"; fi
          gradle build $ARGS

      - uses: actions/upload-artifact@v4
        with:
          name: customdrops-${{ matrix.target.minecraft }}
          path: build/libs/*.jar

  check-api-drift:
    needs: discover-versions
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest discovered Minecraft version
        id: newest
        run: |
          NEWEST_TARGET=$(echo '${{ needs.discover-versions.outputs.targets }}' | jq -c 'max_by(.minecraft | split(".") | map(tonumber))')
          echo "version=$(echo "$NEWEST_TARGET" | jq -r '.minecraft')" >> "$GITHUB_OUTPUT"
          echo "java=$(echo "$NEWEST_TARGET" | jq -r '.java')" >> "$GITHUB_OUTPUT"
          echo "loader=$(echo "$NEWEST_TARGET" | jq -r '.loader')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.newest.outputs.java }}

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.5.1

      - name: Decompile Minecraft ${{ steps.newest.outputs.version }} sources
        run: gradle genSourcesWithVineflower -Pminecraft_version=${{ steps.newest.outputs.version }} -Ploader_version=${{ steps.newest.outputs.loader }}

      - name: Extract signatures of tracked classes
        run: |
          mkdir -p api-current
          JAR=$(find . -path "*/loom-cache/minecraftMaven/*" -iname "*-sources.jar" | head -1)
          if [ -z "$JAR" ]; then
            echo "Could not locate decompiled sources jar, skipping drift check" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while read -r f; do
            [ -z "$f" ] && continue
            mkdir -p "api-current/$(dirname "$f")"
            unzip -p "$JAR" "$f" 2>/dev/null | grep -E "^\s*(public|protected|default)\s" > "api-current/$f.sig" || true
          done < api-baseline/tracked-files.txt

      - name: Diff against stored baseline
        run: |
          mkdir -p api-drift-report
          while read -r f; do
            [ -z "$f" ] && continue
            if [ -f "api-baseline/$f.sig" ] && [ -f "api-current/$f.sig" ]; then
              if ! diff -u "api-baseline/$f.sig" "api-current/$f.sig" > "api-drift-report/$(basename "$f").diff" 2>&1; then
                {
                  echo "### API drift detected: $f"
                  echo '```diff'
                  cat "api-drift-report/$(basename "$f").diff"
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
              fi
            elif [ ! -f "api-baseline/$f.sig" ]; then
              echo "No baseline yet for $f (add one to api-baseline/ once verified)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < api-baseline/tracked-files.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-drift-report
          path: api-drift-report/

  release:
    if: github.event_name == 'push'
    needs: [discover-versions, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish one release per Minecraft version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for dir in artifacts/customdrops-*; do
            [ -d "$dir" ] || continue
            mc="${dir#artifacts/customdrops-}"
            jars=( "$dir"/*.jar )
            [ -e "${jars[0]}" ] || continue
            echo "Publishing v${mc}"
            if gh release view "v${mc}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "v${mc}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
            gh release create "v${mc}" "${jars[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Custom Drops v${mc}" \
              --notes "Custom Drops for Minecraft ${mc}, built automatically by GitHub Actions."
          done